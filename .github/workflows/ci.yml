name: CI

# Gate RNF-01: todo push/PR precisa passar por `npm run build` limpo
# (tsc -b + vite build). Sem isso, nada entra no main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (gate RNF-01)
        run: npm run build
